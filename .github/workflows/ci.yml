name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # 버전은 rust-toolchain.toml 이 정한다 (로컬과 CI 가 갈리지 않게).
      # 이 액션은 rustup 만 준비하고, cargo 가 고정 툴체인을 끌어온다.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  exe:
    name: mfind.exe 빌드
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: 크기 확인
        run: dir target\release\mfind.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: mfind-windows-x64
          path: target/release/mfind.exe
          if-no-files-found: error
