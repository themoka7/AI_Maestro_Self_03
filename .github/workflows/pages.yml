name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것이 이긴다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: web/ 를 Pages 로 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 아티팩트용 조각(web/app.html) 을 단독 문서로 감싼다.
      # <meta charset> 이 없으면 한글이 깨지므로 이 단계가 필수다.
      - name: 페이지 빌드
        run: python3 web/build.py _site

      - name: 결과 확인
        run: |
          test -s _site/index.html
          grep -q '<meta charset="utf-8">' _site/index.html
          grep -q '<title>mfind web</title>' _site/index.html
          echo "빌드 결과 $(wc -c < _site/index.html) bytes"

      # 렌더만 되는 것과 동작하는 것은 다르다. 가짜 디렉터리 핸들로 2단계
      # 인덱싱을 실제로 돌려 본다 — 자식 범위가 한 칸 어긋나면 엉뚱한 파일에
      # 크기가 붙고 그건 곧 잘못된 중복 보고다. 실패하면 배포하지 않는다.
      - name: 웹 자체 점검
        run: |
          cp web/selftest.js _site/
          printf '\n<script src="selftest.js"></script>\n' >> _site/index.html
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          if [ -z "$CHROME" ]; then echo "크롬을 찾을 수 없다"; exit 1; fi
          echo "브라우저: $CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --dump-dom \
            --virtual-time-budget=20000 "file://$PWD/_site/index.html?selftest=1" > dom.html
          TITLE=$(grep -o '<title>[^<]*</title>' dom.html | sed 's|</\?title>||g')
          echo "$TITLE" | tr '|' '\n'
          if ! echo "$TITLE" | grep -q SELFTEST; then
            echo "자체 점검이 실행되지 않았다 (스크립트 오류일 수 있다)"; exit 1
          fi
          if echo "$TITLE" | grep -q FAIL; then
            echo "자체 점검 실패"; exit 1
          fi
          echo "자체 점검 통과"

      # 점검용으로 붙인 것을 지우고 배포본을 다시 만든다.
      - name: 배포본 재생성
        run: |
          rm -rf _site dom.html
          python3 web/build.py _site
          test -s _site/index.html
          ! grep -q selftest.js _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
